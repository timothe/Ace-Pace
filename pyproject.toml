[project]
name = "ace-pace"
version = "0.1.0"
description = "Ace-Pace - One Pace Library Manager: scrapes Nyaa, CRC32-matches releases, renames and downloads One Pace episodes"
requires-python = ">=3.13"
dependencies = [
  "requests",
  "beautifulsoup4",
  "qbittorrent-api",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-mock>=3.10.0",
  "pytest-cov>=4.0.0",
  "coverage>=7.0.0",
  "pyright",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=.",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-report=html",
  "--cov-branch",
]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow running tests",
]
